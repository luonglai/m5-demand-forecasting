# Databricks run. Raw CSVs live in a Unity Catalog volume; outputs are Delta tables.
storage:
  raw_path: /Volumes/workspace/m5/raw
  mode: table
  base_path: null
  catalog: workspace
  schema: m5
  report_dir: null

scope:
  categories: [FOODS]
  stores: null
  max_items: null

forecast:
  horizon: 28
  season_length: 7
  cutoffs: [1885, 1913]
  train_days: 730

lightgbm:
  objective: tweedie
  tweedie_variance_power: 1.1
  learning_rate: 0.05
  num_leaves: 127
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  num_boost_round: 600
  seed: 42
  verbose: -1

inventory:
  service_level: 0.95
  lead_time_days: 1
