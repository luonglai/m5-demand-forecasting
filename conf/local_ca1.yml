# Local run on one store (CA_1): quick real-data check before the full run.
storage:
  raw_path: data/raw            # folder holding the three M5 CSVs
  mode: path                    # "path" (Parquet folders) or "table" (Unity Catalog tables)
  base_path: data/lake_ca1
  catalog: null                 # used when mode = table
  schema: null
  report_dir: results/ca1

scope:
  categories: [FOODS]           # M5 categories to keep: FOODS, HOUSEHOLD, HOBBIES
  stores: [CA_1]                # quick check on one store (about 10-15 min)
  max_items: null               # cap items per department (handy for quick runs)

forecast:
  horizon: 28                   # days ahead, as in the M5 competition
  season_length: 7              # weekly seasonality
  # Each cutoff is the last training day ("d_" number). The model forecasts the
  # next `horizon` days. The first fold is the validation fold (used to size
  # safety stock), the last fold is the held-out test fold.
  cutoffs: [1885, 1913]
  train_days: 730               # history used to train the ML model

lightgbm:
  objective: tweedie
  tweedie_variance_power: 1.1
  learning_rate: 0.05
  num_leaves: 127
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  num_boost_round: 600
  seed: 42
  verbose: -1

inventory:
  service_level: 0.95           # target cycle service level
  lead_time_days: 1             # replenishment lead time used for safety stock
